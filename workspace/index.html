<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workspace</title>
  <link rel="icon" href="data:,">

  <!-- Start the two faces this page actually renders in before the stylesheets
       that reference them are even parsed. crossorigin is REQUIRED on a font
       preload even though these are same-origin: fonts are always fetched in
       CORS mode, and a preload whose mode does not match is simply fetched a
       second time. JetBrains Mono is not preloaded — nothing here uses it. -->

  <script>
    // Resolve and apply the platform's theme BEFORE first paint. Inline, and
    // first, because a <script src> would race the render and flash the wrong
    // theme; theme.js below carries the same logic for live changes.
    //
    // Contract (references/theming.md): key `dkubex-ui-theme`, raw unquoted
    // "dark" | "light" | "system", DEFAULT DARK, applied as a class on <html>.
    // Note it always sets an EXPLICIT class — never "no class means light" —
    // because the terminal's --jp-* overrides key off html.light / html.dark.
    (function () {
      var t = "dark";
      try { t = localStorage.getItem("dkubex-ui-theme") || "dark"; } catch (e) {}
      if (t === "system") {
        t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      var r = document.documentElement;
      r.classList.remove("light", "dark");
      r.classList.add(t === "light" ? "light" : "dark");
    })();
  </script>

  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="demo.css">
</head>
<body>
  <div class="app-shell">
    <!-- macOS-style side rail: brand, Apps home, dock of opened apps, theme toggle. -->
    <aside class="rail" aria-label="Application dock">
      <button type="button" id="brand" class="rail-tile brand" title="All apps" aria-label="All apps">
        <img src="icons/apps.svg" alt="" aria-hidden="true">
      </button>

      <div class="rail-divider"></div>

      <!-- Opened apps, populated by app.js -->
      <div id="dock" class="dock" aria-label="Open applications"></div>

      <button type="button" id="theme-toggle" class="rail-tile ghost" title="Toggle theme" aria-label="Toggle theme">
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
             stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor"
             stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
      </button>
    </aside>

    <main class="stage">
      <!-- Apps catalog view -->
      <section id="catalog" class="catalog">
        <header class="head">
          <h1>Apps</h1>
        </header>
        <div class="search">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
               stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7"/>
            <path d="m21 21-4.3-4.3"/>
          </svg>
          <input id="search" type="search" placeholder="Search applications…"
                 autocomplete="off" spellcheck="false" aria-label="Search applications">
        </div>
        <p class="section-label">All Applications</p>
        <section id="grid" class="grid" aria-label="Applications"></section>
      </section>

      <!-- Persistent iframe host; shown when an app is open. Managed by app.js. -->
      <div id="frames" class="frames" hidden></div>
    </main>
  </div>

  <script src="theme.js"></script>
  <script src="demo-data.js"></script>
  <script src="demo.js"></script>
  <script src="app.js"></script>
</body>
</html>
